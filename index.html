<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111310"><meta name="description" content="LOX — игра по мотивам взлома замков Gothic Remake: случайные решаемые сундуки, связанные пластины и объяснение механики."><title>LOX</title><link rel="stylesheet" href="./style.css"></head>
<body class="game-page"><header class="header"><a href="./" class="brand"><span class="brand-mark">⌘</span> LOX <span class="brand-sub">Gothic Remake Lockpick Generator</span></a><nav aria-label="Главная навигация"><a href="./" aria-current="page">Практика</a><a href="./guide.html">Правила <span aria-hidden="true">↗</span></a></nav><div class="mobile-nav"><button id="open-links">Связи</button><button id="open-menu">Меню</button></div></header>
<main class="workspace"><div class="page-heading"><h1>Взлом замка</h1><div class="mode-tag" id="mode-tag">Новичок</div></div>
<div class="layout"><aside class="setup"><section><h2>Сундук</h2><fieldset><legend class="sr-only">Сложность замка</legend><div class="levels"><button data-count="4" aria-pressed="true">4</button><button data-count="5" aria-pressed="false">5</button><button data-count="6" aria-pressed="false">6</button><button data-count="7" aria-pressed="false">7</button></div></fieldset><div class="level-caption"><strong id="difficulty">Простой</strong></div><button class="primary" id="new">Новый замок</button></section><section class="settings"><button class="toggle" id="show-links" aria-pressed="true">Связи</button></section><section class="audio-settings"><button class="toggle" id="sound" aria-pressed="true">Звук</button><button class="toggle" id="fragile" aria-pressed="true">Поломка</button><p class="fine" id="pick-status">Целая</p><button id="replace-pick" class="primary" hidden>Заменить отмычку</button></section></aside>
<section class="game" aria-label="Замок"><div class="game-heading"><div><h2 id="chest-name">Замок ученика</h2></div><span id="status-label" class="status-label">Закрыт</span></div><div id="board" class="board"></div><div class="game-bottom"><div id="result" class="result" role="status" hidden></div><div class="secondary-actions"><button id="undo" class="quiet" disabled>↶ Отмена</button><button id="reset" class="quiet">Сброс</button></div></div><div class="mobile-controls"><button id="mobile-left" aria-label="Сдвинуть выбранную пластину влево">‹</button><button id="mobile-action" aria-label="Новый замок"></button><button id="mobile-right" aria-label="Сдвинуть выбранную пластину вправо">›</button></div><div class="keyboard-hint"><span><kbd>↑</kbd><kbd>↓</kbd> Выбор</span><span><kbd>←</kbd><kbd>→</kbd> Сдвиг</span><span><kbd>R</kbd> Сброс</span><span><kbd>Space</kbd> Новый замок</span></div></section>
<aside class="connections"><h2>Связи</h2><p class="connection-intro">Строка → столбец</p><div id="matrix"></div><div class="link-legend"><p><b class="same">+</b><span>Вместе</span></p><p><b class="opposite">−</b><span>Навстречу</span></p></div><div class="selected-note" id="selected-note"></div></aside></div><footer><span>LOX</span><a href="./guide.html">Правила</a></footer></main><dialog id="mobile-menu" class="game-sheet" aria-labelledby="menu-title"><div class="sheet-heading"><h2 id="menu-title">Меню</h2><button data-close aria-label="Закрыть меню">✕</button></div><div id="menu-content"></div><a class="rules-link" href="./guide.html">Правила ↗</a></dialog><dialog id="mobile-links" class="game-sheet" aria-labelledby="links-title"><div class="sheet-heading"><h2 id="links-title">Связи</h2><button data-close aria-label="Закрыть связи">✕</button></div><div id="links-content"></div></dialog><script type="module" src="./app.js"></script></body></html>
